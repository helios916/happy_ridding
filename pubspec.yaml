name: happy_ridding
description: 骑行记录 App，帮助你记录骑行、坚持锻炼。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 状态管理
  provider: ^6.1.2

  # 路由
  go_router: ^14.2.0

  # 定位 / 地图
  geolocator: ^12.0.0
  flutter_map: ^7.0.1
  latlong2: ^0.9.1

  # 网络
  http: ^1.2.1

  # 图表与格式化
  fl_chart: ^0.68.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
